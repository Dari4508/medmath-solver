name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check app tests alembic locustfile.py
      - name: Format check (black)
        run: black --check app tests alembic locustfile.py
      - name: Type check (mypy)
        run: mypy app
      - name: Tests with coverage
        run: pytest --cov=app --cov-fail-under=100

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check JS
        run: |
          for f in js/*.js; do node --check "$f"; done
      - name: HTML sanity
        run: python3 -c "import pathlib; html=pathlib.Path('index.html').read_text(); assert '</html>' in html"

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: docker compose up -d --build
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        working-directory: tests/e2e
        run: npm ci && npx playwright install --with-deps chromium
      - name: Wait for services
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/api/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/api/health
      - name: Run E2E
        working-directory: tests/e2e
        env:
          E2E_NO_SERVER: "1"
          E2E_BASE_URL: "http://127.0.0.1:3000"
        run: npm test
      - name: Smoke test
        run: ./scripts/smoke_test.sh
      - name: Teardown
        if: always()
        run: docker compose down -v --remove-orphans || true
