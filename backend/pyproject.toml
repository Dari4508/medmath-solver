[project]
name = "medmath-solver"
version = "1.1.0"
description = "Sistemas lineales con eliminación de Gauss aplicados a farmacia hospitalaria"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.3.0",
    "slowapi>=0.1.9",
    "structlog>=24.0.0",
    "prometheus-client>=0.20.0",
    "python-multipart>=0.0.9",
    "alembic>=1.13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "black>=24.10.0",
    "mypy>=1.13.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --cov=app --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "__pycache__", "tests/__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008"]

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = ".venv"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [".venv", "tests"]

[[tool.mypy.overrides]]
module = "app.*"
disallow_untyped_defs = false
